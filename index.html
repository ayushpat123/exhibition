<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf9fa">
    <meta name="description" content="EXBT — an exhibition of moving sketches, photographs, and found patterns.">
    <title>EXBT</title>
    <link rel="icon" href="./favicon.ico">
    <link rel="mask-icon" href="./safari-pinned-tab.svg" color="#000000">
    <link rel="stylesheet" href="./assets/styles-E7MMUUKE.css">
    <script type="module" src="./assets/main-6JMROBZY.js"></script>
  </head>
  <body>
    <header class="header">
      <h1><img class="logo" src="./assets/exbt.png" width="110" height="30" alt="EXBT"></h1>
      <button id="motion" class="motion" type="button" aria-pressed="false" hidden>Pause motion</button>
    </header>
    <main class="gallery" aria-label="Exhibition">
      <figure class="tile tile--hero" aria-label="Waves: animated white lines. Move your pointer or touch to change their shape.">
        <canvas data-art="waves" role="img" aria-label="Animated white waves on black. Move your pointer or touch to change their shape.">White waves on a black background.</canvas>
        <noscript><p class="fallback">Enable JavaScript to see the moving waves.</p></noscript>
      </figure>
      <figure class="tile" style="--inset: 8.33%">
        <img src="./assets/riverfront-400.webp" srcset="./assets/riverfront-400.webp 400w, ./assets/riverfront-800.webp 800w" sizes="(max-width: 340px) 85vw, 300px" width="800" height="800" alt="Steps and buildings along a riverfront" decoding="async" fetchpriority="high">
      </figure>
      <figure class="tile" aria-label="Particles: a field of softly accumulating grey circles.">
        <canvas data-art="particles" role="img" aria-label="Grey circles accumulating across a black canvas">Grey circles on a black background.</canvas>
        <noscript><p class="fallback">Enable JavaScript to see the moving particles.</p></noscript>
      </figure>
      <figure class="tile" style="--inset: 16.67%">
        <img src="./assets/stamps-358.webp" width="358" height="400" alt="Four yellow Swedish postage stamps" loading="lazy" decoding="async">
      </figure>
      <figure class="tile" style="--inset: 3.33%">
        <img src="./assets/mountains-400.webp" srcset="./assets/mountains-400.webp 400w, ./assets/mountains-800.webp 800w" sizes="300px" width="800" height="360" alt="Snow-covered mountains beneath a cloudy sky" loading="lazy" decoding="async">
      </figure>
      <figure class="tile" style="--inset: 13.33%">
        <img src="./assets/tiles-400.webp" srcset="./assets/tiles-400.webp 400w, ./assets/tiles-800.webp 800w" sizes="300px" width="800" height="961" alt="Blue patterned tiles with overlapping circular lines" loading="lazy" decoding="async">
      </figure>
      <figure class="tile tile--portrait">
        <img src="./assets/canopy-400.webp" srcset="./assets/canopy-400.webp 400w, ./assets/canopy-800.webp 800w" sizes="300px" width="800" height="1422" alt="Sunlight shining through a leafy tree canopy" loading="lazy" decoding="async">
      </figure>
      <figure class="tile tile--portrait" style="--inset: 3.33%">
        <img src="./assets/dome-400.webp" srcset="./assets/dome-400.webp 400w, ./assets/dome-800.webp 800w" sizes="300px" width="800" height="1422" alt="Black and white photograph looking up into an ornate dome" loading="lazy" decoding="async">
      </figure>
      <figure class="tile" style="--inset: 3.33%">
        <img src="./assets/stairs-400.webp" srcset="./assets/stairs-400.webp 400w, ./assets/stairs-800.webp 800w" sizes="300px" width="800" height="855" alt="Black and white view down a geometric stairwell" loading="lazy" decoding="async">
      </figure>
      <figure class="tile tile--archive">
        <a href="https://ipfs.io/ipfs/QmdiGgzfqxVRS4euboQbBpbRaqe4HX3zkDJgouDd18weRt" target="_blank" rel="noopener noreferrer"><span>Archived artwork</span><small>Original image unavailable<br>Open archive ↗</small></a>
      </figure>
    </main>
  </body>
</html>
