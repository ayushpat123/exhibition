<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf9fa">
    <meta name="description" content="EXBT — an exhibition of moving sketches, photographs, and found patterns.">
    <title>EXBT</title>
    <link rel="icon" href="./favicon.ico">
    <link rel="mask-icon" href="./safari-pinned-tab.svg" color="#000000">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <header class="header">
      <h1><img class="logo" src="./assets/exbt.png" width="110" height="30" alt="EXBT"></h1>
      <button id="motion" class="motion" type="button" aria-pressed="false" hidden>Pause motion</button>
    </header>
    <main class="gallery" aria-label="Exhibition">
      <!-- GALLERY -->
    </main>
    <dialog id="border-editor" class="border-editor" aria-labelledby="border-heading" aria-describedby="border-publishing">
      <div class="border-heading"><div><p class="border-eyebrow">Frame</p><h2 id="border-heading">Border settings</h2><p id="border-title"></p></div><button id="border-close" type="button" aria-label="Close border settings">✕</button></div>
      <div class="border-preview"><img alt="" decoding="async"></div>
      <div class="border-field"><label for="border-width">Width</label><output id="border-width-value" for="border-width"></output></div>
      <input id="border-width" type="range" min="0" max="30" step="0.01" value="6">
      <div class="border-presets" role="group" aria-label="Border width presets"><button type="button" data-border-width="0" aria-pressed="false">None</button><button type="button" data-border-width="3" aria-pressed="false">Thin</button><button type="button" data-border-width="6" aria-pressed="false">Medium</button><button type="button" data-border-width="12" aria-pressed="false">Wide</button></div>
      <div class="border-field"><label for="border-color">Colour</label><input id="border-color" type="color" value="#000000"></div>
      <div class="border-presets" role="group" aria-label="Border colour presets"><button type="button" data-border-color="#000000" aria-pressed="false">Black</button><button type="button" data-border-color="#111214" aria-pressed="false">Charcoal</button><button type="button" data-border-color="#f5f5f0" aria-pressed="false">Ivory</button><button type="button" data-border-color="edge" aria-pressed="false">From edges</button></div>
      <p id="border-publishing" class="border-help">Publishing opens GitHub for your confirmation. Only the gallery owner can publish changes.</p>
      <div class="border-actions"><button id="border-reset" type="button">Reset preview</button><a id="border-publish" href="https://github.com/ayushpat123/exhibition/issues/new" target="_blank" rel="noopener noreferrer">Publish via GitHub ↗</a></div>
      <p id="border-status" class="border-help" role="status" aria-live="polite"></p>
    </dialog>
    <script id="gallery-data" type="application/json"><!-- GALLERY_DATA --></script>
  </body>
</html>
